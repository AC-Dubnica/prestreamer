<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; img-src 'self' media: data:; media-src media: blob: mediastream:" />
    <title>prestreamer</title>
    <style>
      :root { --bg:#101218; --panel:#171a22; --panel2:#1d212b; --line:#2a2f3c; --text:#e8eaf0; --dim:#8b93a7; --accent:#3b82f6; --live:#ef4444; --ok:#4ade80; }
      * { box-sizing: border-box }
      html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font: 13px system-ui, sans-serif; user-select: none; }
      #app { display: grid; grid-template-rows: 44px 1fr; height: 100%; }
      header { display: flex; align-items: center; gap: 12px; padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
      header .brand { font-weight: 700; letter-spacing: .02em }
      header .sp { flex: 1 }
      .view { display: none; min-height: 0 }
      .view.active { display: grid }
      #view-present { grid-template-columns: 270px 1fr 380px }
      #view-songs { grid-template-columns: 270px 1fr }
      #view-mixer { display: none; overflow: auto } #view-mixer.active { display: block }
      aside, #center, #right, #songeditor { min-height: 0; overflow: auto; }
      #songeditor { padding: 12px 20px }
      nav#tabs { display: flex; gap: 4px; margin-left: 16px }
      nav#tabs button { display: flex; align-items: center; gap: 6px; background: transparent; border: 0; border-radius: 6px; padding: 6px 12px; color: var(--dim) }
      nav#tabs button.on { background: var(--panel2); color: var(--text) }
      .ib { display: inline-flex; align-items: center; gap: 6px; padding: 4px 6px; line-height: 0 } .ib span { line-height: 1.2 }
      .ib svg { display: block }
      .tools { display: inline-flex; gap: 4px }
      .onair { color: var(--live); font-weight: 700; letter-spacing: .08em }
      .modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: flex-start; justify-content: center; padding-top: 12vh; z-index: 10 }
      .modal[hidden] { display: none }
      .dialog { width: 420px; max-height: 60vh; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; overflow: hidden }
      .dialog .list { overflow: auto }
      aside { background: var(--panel); border-right: 1px solid var(--line); }
      #right { background: var(--panel); border-left: 1px solid var(--line); }
      .head { padding: 10px 12px 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); display: flex; align-items: center; justify-content: space-between; }
      .item { padding: 7px 12px; cursor: pointer; border-left: 3px solid transparent; }
      .item:hover { background: var(--panel2) }
      .item.sel { background: var(--panel2); border-left-color: var(--accent) }
      #center { padding: 12px 16px; }
      #center h1 { font-size: 16px; margin: 0 0 12px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; margin-bottom: 18px; }
      .card { border: 2px solid transparent; border-radius: 6px; cursor: pointer; background: var(--panel2); overflow: hidden; }
      .card:hover { border-color: #3a4152 }
      .card.live { border-color: var(--live) }
      .card .tag { font-size: 10px; padding: 3px 6px; font-weight: 600; color: #fff; text-transform: uppercase; letter-spacing: .05em; }
      .screen { margin: 0 12px 14px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
      .screen.sel { border-color: var(--accent) }
      .screen .bar select { min-width: 0; max-width: 100px; }
      .screen .bar { display: flex; align-items: center; gap: 6px; padding: 6px 8px; }
      .screen .name { flex: 1; font-weight: 600; cursor: pointer }
      .screen .meta { color: var(--dim); font-size: 11px }
      .pv { position: relative; }
      .pv .off { position: absolute; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; color: var(--dim); font-weight: 700; letter-spacing: .15em; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim) } .dot.on { background: var(--live); box-shadow: 0 0 6px var(--live) }
      button, select, input[type=text], input[type=number] { background: #262b38; color: inherit; border: 1px solid #3a4152; border-radius: 5px; padding: 4px 8px; font: inherit; }
      button:hover { background: #313849; cursor: pointer }
      button.primary { background: var(--accent); border-color: var(--accent) }
      button.danger { background: var(--live); border-color: var(--live) }
      .sw { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 8px }
      .sw button { width: 38px; height: 24px; padding: 0; border-radius: 4px }
      .form { display: grid; grid-template-columns: 90px 1fr; gap: 6px 8px; align-items: center; padding: 4px 12px 12px; }
      .row { padding: 5px 12px; color: var(--dim) }
      .svc { display: flex; gap: 6px; padding: 0 12px 6px } .svc select, .svc input { flex: 1; min-width: 0 }
      .srow { display: flex; align-items: center; gap: 4px; padding: 6px 8px 6px 12px; cursor: pointer; border-left: 3px solid transparent }
      .srow:hover { background: var(--panel2) } .srow.sel { background: var(--panel2); border-left-color: var(--accent) }
      .srow .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
      .srow .n { color: var(--dim); width: 16px } .srow button, .item button { padding: 0 6px; font-size: 11px }
      .item { display: flex; align-items: center; gap: 6px } .item .t { flex: 1 }
      .vpanel { max-width: 560px } .vcard { margin-bottom: 14px }
      .vt { display: flex; gap: 8px; align-items: center; flex-wrap: wrap } .vt input[type=range] { flex: 1; min-width: 160px; padding: 0 }
      .vt .time { font-variant-numeric: tabular-nums; color: var(--dim); min-width: 110px; text-align: right }
      .srow .kind { color: var(--dim); display: inline-flex } .srow .livemark { color: var(--live) }
      .srow .ib { padding: 2px 4px } .item .ib { padding: 2px 5px }
      button.ib.primary { background: var(--accent); border-color: var(--accent) } button.ib.danger { background: var(--live); border-color: var(--live) }
      .svc.pad { padding: 10px } button:disabled { opacity: .4; cursor: default }
      /* mixer console */
      #view-mixer { padding: 12px 16px } .mxbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px } .mxbar h2 { margin: 0; font-size: 16px }
      .mxstatus { color: var(--dim); font-size: 12px } .mxstatus.running { color: var(--ok) } .mxstatus.error { color: #f87171 }
      .strips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; align-items: stretch }
      .strip { width: 104px; flex: none; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px; display: flex; flex-direction: column; gap: 6px; cursor: pointer }
      .strip.sel { border-color: var(--accent) } .strip.master { width: 150px; background: var(--panel); cursor: default }
      .strip .top { display: flex; align-items: center; justify-content: space-between; color: var(--dim); font-size: 11px; font-weight: 700 }
      .strip input[type=text] { width: 100%; padding: 2px 4px; font-size: 12px; text-align: center }
      .mf { display: flex; gap: 6px; justify-content: center; height: 160px }
      .meter { position: relative; width: 12px; height: 100%; background: #0b0d12; border-radius: 3px; overflow: hidden }
      .meter .fill { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: #22c55e } .meter .fill.mid { background: #eab308 } .meter .fill.hot { background: #ef4444 }
      .meter .peak { position: absolute; left: 0; right: 0; height: 2px; background: #e5e7eb } .meter .gr { position: absolute; left: 0; right: 0; top: 0; height: 0; background: #38bdf8; opacity: .85 }
      input.vfader { writing-mode: vertical-lr; direction: rtl; width: 26px; height: 100%; padding: 0 }
      .db { text-align: center; font-variant-numeric: tabular-nums; font-size: 12px }
      .btns2 { display: flex; gap: 4px } .btns2 .ms { flex: 1; padding: 3px 0; font-weight: 700 } .ms.on.mute { background: #dc2626; border-color: #dc2626 } .ms.on.solo { background: #eab308; border-color: #eab308; color: #111 }
      .strip input[type=range]:not(.vfader) { width: 100% }
      .detail { margin-top: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px } .detail h3 { margin: 0 0 8px; font-size: 14px }
      .sections { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 18px 24px } .sections .col, .sect { min-width: 0 }
      .sect .shead, .shead.plain { display: flex; gap: 8px; align-items: center; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin-bottom: 6px }
      .sbody.off { opacity: .45 } .prm { display: grid; grid-template-columns: 74px minmax(0, 1fr) 64px; gap: 8px; align-items: center; margin: 3px 0 } .prm input[type=range] { min-width: 0; width: 100% } .prm .val { text-align: right; font-variant-numeric: tabular-nums; color: var(--dim); font-size: 12px }
      .ml { margin-left: 8px; color: var(--text) } .grow { flex: 1 } .sw.nopad { padding: 0 }
      textarea { width: 100%; background: #262b38; color: inherit; border: 1px solid #3a4152; border-radius: 6px; padding: 8px; font: 13px ui-monospace, Menlo, monospace; resize: vertical; user-select: text }
      .editorwrap { display: grid; grid-template-columns: 1fr 300px; gap: 20px; align-items: start }
      .editor .field { margin-bottom: 14px; display: flex; flex-direction: column; gap: 6px }
      .editor label, .editorprev label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim) }
      .btns { display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
      .editor input[type=text] { width: 100% }
      .status { padding: 4px 12px 12px; color: var(--dim); white-space: pre-wrap; font-size: 12px }
      .status.error { color: #f87171 } .status.running { color: var(--ok) }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <span class="brand">prestreamer</span>
        <nav id="tabs"></nav>
        <span class="sp"></span>
        <span id="onair" class="onair" hidden>● LIVE</span>
        <span id="headbtns"></span>
      </header>
      <div id="view-present" class="view" data-view="present">
        <aside>
          <div class="head">Service
            <span class="tools" id="svctools"></span></div>
          <div class="svc"><select id="servicesel"></select></div>
          <div class="svc"><input id="servicename" type="text" placeholder="Service name" /></div>
          <div class="head">Run sheet <span class="tools" id="addtools"></span></div>
          <div id="schedule"></div>
          <div id="videostatus" class="status"></div>
        </aside>
        <div id="center"></div>
        <div id="right">
          <div class="head">Screens <span class="tools" id="screentools"></span></div>
          <div id="screens"></div>
          <div class="head">Stream</div>
          <div id="stream"></div>
          <div class="head">Audio</div>
          <div id="audio"></div>
          <div class="head">Look: <span id="lookname" class="ml"></span><span class="grow"></span></div>
          <div id="look"></div>
          <div class="head">Physical displays</div>
          <div id="displays"></div>
        </div>
      </div>
      <div id="view-songs" class="view" data-view="songs">
        <aside>
          <div class="head">Songs <span class="tools" id="songtools"></span></div>
          <div class="svc"><input id="songfilter" type="text" placeholder="Search songs…" /></div>
          <div id="library"></div>
        </aside>
        <div id="songeditor"></div>
      </div>
      <div id="view-mixer" class="view" data-view="mixer"></div>
    </div>
    <div id="modal" class="modal" hidden></div>
    <script src="operator.js"></script>
  </body>
</html>
