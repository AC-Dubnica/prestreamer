name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The macOS (Apple silicon) jobs run on our self-hosted runner (labels: self-hosted, macOS, ARM64); Windows and Linux use
  # GitHub's hosted runners. `os` only names the job and its artifacts, `runner` is what `runs-on` gets.

  # Fast, deterministic checks: types, unit tests with coverage, and the production build.
  test:
    name: Unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, runner: [self-hosted, macOS, ARM64] }
          - { os: windows-latest, runner: windows-latest }
          - { os: ubuntu-latest, runner: ubuntu-latest }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage/
          retention-days: 14

  # Drives the real app (streaming, video, mixer). It needs a display and the runner's audio stack, which hosted
  # runners do not always provide, so a failure here is reported but does not block merging until it has been
  # shown stable. Remove `continue-on-error` once it is.
  e2e:
    name: End-to-end (${{ matrix.os }})
    needs: test
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, runner: [self-hosted, macOS, ARM64] }
          - { os: windows-latest, runner: windows-latest }
          - { os: ubuntu-latest, runner: ubuntu-latest }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install ffmpeg and a virtual display (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb libasound2t64 libgbm1 libnss3 libgtk-3-0t64
      - name: Install ffmpeg (macOS; the self-hosted runner usually has it already)
        if: runner.os == 'macOS'
        run: command -v ffmpeg >/dev/null || brew install ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - run: npm ci
      - name: End-to-end (Linux, on a virtual display and without the Chromium sandbox)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run e2e
        env:
          E2E_OUT_DIR: ${{ runner.temp }}/prestreamer-e2e
          ELECTRON_DISABLE_SANDBOX: '1'
      - name: End-to-end
        if: runner.os != 'Linux'
        run: npm run e2e
        env:
          E2E_OUT_DIR: ${{ runner.temp }}/prestreamer-e2e

  # Installers for each platform. Unsigned: macOS shows an "unidentified developer" warning and Windows SmartScreen
  # warns until the builds are signed (see README).
  package:
    name: Package (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, runner: [self-hosted, macOS, ARM64] }
          - { os: windows-latest, runner: windows-latest }
          - { os: ubuntu-latest, runner: ubuntu-latest }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Make sure the bundled ffmpeg is downloaded
        run: node node_modules/ffmpeg-static/install.js
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: prestreamer-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 30
